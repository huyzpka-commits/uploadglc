<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UploadGLC - File Manager</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="authGuard" class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="logo">📁</span>
        <h1>UploadGLC</h1>
      </div>
      <nav class="menu">
        <button class="btn btn-primary" onclick="openUploadModal()">+ Upload File</button>
        <button class="btn btn-secondary" onclick="openFolderModal()">+ New Folder</button>
      </nav>
      <div class="storage-info">
        <h3>Storage</h3>
        <div class="progress-bar">
          <div class="progress-fill" id="storageBar"></div>
        </div>
        <p id="storageText">Calculating...</p>
      </div>
      <div class="user-card" id="userCard">
        <div class="user-avatar" id="userAvatar">👤</div>
        <div class="user-info">
          <div class="user-name" id="userName">Guest</div>
          <div class="user-email" id="userEmail">—</div>
        </div>
        <button class="btn btn-secondary" onclick="logout()" style="margin-top:8px;width:100%;font-size:12px;padding:6px;">Logout</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="breadcrumbs" id="breadcrumbs">
          <span class="crumb" data-path="">My Drive</span>
        </div>
        <div class="search">
          <input type="text" id="searchInput" placeholder="Search files...">
        </div>
      </header>

      <section class="content">
        <div class="toolbar">
          <span id="itemCount">0 items</span>
          <div class="view-toggle">
            <button class="icon-btn active" onclick="setView('grid')" title="Grid view">⊞</button>
            <button class="icon-btn" onclick="setView('list')" title="List view">☰</button>
          </div>
        </div>
        <div class="items" id="itemsContainer" data-view="grid"></div>
      </section>
    </main>
  </div>

  <!-- Upload Modal -->
  <div class="modal" id="uploadModal">
    <div class="modal-content">
      <h2>Upload Files</h2>
      <div class="dropzone" id="dropzone">
        <p>Drag & drop files here or click to browse</p>
        <input type="file" id="fileInput" multiple hidden>
      </div>
      <div class="file-list" id="uploadList"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeUploadModal()">Cancel</button>
        <button class="btn btn-primary" onclick="uploadFiles()">Upload</button>
      </div>
    </div>
  </div>

  <!-- Folder Modal -->
  <div class="modal" id="folderModal">
    <div class="modal-content">
      <h2>New Folder</h2>
      <input type="text" id="folderName" placeholder="Folder name">
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeFolderModal()">Cancel</button>
        <button class="btn btn-primary" onclick="createFolder()">Create</button>
      </div>
    </div>
  </div>

  <!-- Preview Modal -->
  <div class="modal" id="previewModal">
    <div class="modal-content modal-large">
      <div class="preview-header">
        <h3 id="previewTitle"></h3>
        <button class="close-btn" onclick="closePreview()">✕</button>
      </div>
      <div class="preview-body" id="previewBody"></div>
    </div>
  </div>

  <!-- Share Modal -->
  <div class="modal" id="shareModal">
    <div class="modal-content">
      <h2>🔗 Share Link</h2>
      <p style="font-size:13px;color:var(--text-light);margin-bottom:10px">Anyone with this link can download the file.</p>
      <div class="share-input-row">
        <input type="text" id="shareLinkInput" readonly>
        <button class="btn btn-primary" onclick="copyShareLink()">Copy</button>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeShareModal()">Close</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/auth-guard.js"></script>
</body>
</html>
