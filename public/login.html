<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - UploadGLC</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-page { display:flex; align-items:center; justify-content:center; height:100vh; background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%); }
    .login-card { background:white; border-radius:16px; padding:36px; width:420px; max-width:90vw; box-shadow:0 20px 60px rgba(0,0,0,0.2); }
    .login-card h2 { text-align:center; margin-bottom:24px; font-size:22px; }
    .login-card .logo { font-size:40px; text-align:center; margin-bottom:8px; }
    .oauth-buttons { display:flex; flex-direction:column; gap:10px; margin-bottom:20px; }
    .oauth-btn { display:flex; align-items:center; justify-content:center; gap:10px; padding:12px; border-radius:8px; border:1px solid var(--border); background:#fff; cursor:pointer; font-weight:600; font-size:14px; transition:all .2s; text-decoration:none; color:var(--text); }
    .oauth-btn:hover { background:var(--bg); }
    .oauth-btn.google { border-color:#4285f4; color:#4285f4; }
    .oauth-btn.microsoft { border-color:#0078d4; color:#0078d4; }
    .oauth-btn.dropbox { border-color:#0061ff; color:#0061ff; }
    .divider { display:flex; align-items:center; gap:12px; margin:16px 0; color:var(--text-light); font-size:13px; }
    .divider::before,.divider::after { content:''; flex:1; height:1px; background:var(--border); }
    .form-group { margin-bottom:14px; }
    .form-group label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
    .form-group input { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px; outline:none; }
    .form-group input:focus { border-color:var(--primary); }
    .login-card .btn { width:100%; margin-top:4px; }
    .toggle-mode { text-align:center; margin-top:16px; font-size:13px; color:var(--text-light); }
    .toggle-mode a { color:var(--primary); cursor:pointer; font-weight:600; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="logo">📁</div>
      <h2 id="formTitle">Welcome to UploadGLC</h2>

      <div class="oauth-buttons">
        <a class="oauth-btn google" href="/api/auth/google">🔴 Login with Google</a>
        <a class="oauth-btn microsoft" href="/api/auth/microsoft">🔵 Login with Microsoft (OneDrive)</a>
        <a class="oauth-btn dropbox" href="/api/auth/dropbox">📦 Login with Dropbox</a>
      </div>

      <div class="divider">or</div>

      <form id="authForm">
        <div class="form-group" id="nameGroup">
          <label for="nameInput">Full Name</label>
          <input type="text" id="nameInput" placeholder="Your name">
        </div>
        <div class="form-group">
          <label for="emailInput">Email</label>
          <input type="email" id="emailInput" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="passwordInput">Password</label>
          <input type="password" id="passwordInput" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">Log In</button>
      </form>

      <div class="toggle-mode">
        <span id="toggleText">Don't have an account?</span>
        <a id="toggleLink">Sign up</a>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
